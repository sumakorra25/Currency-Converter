<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Currency Flow</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell narrow">
      <header class="topbar simple-header">
        <div class="brand">
          <div class="brand-mark">CF</div>
          <div>
            <p class="eyebrow">Account recovery</p>
            <h1>Reset password</h1>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/login">Login</a>
          <a href="/home">Home</a>
        </nav>
      </header>

      <main class="panel auth-panel">
        <p>Enter your account email to create a password reset token.</p>
        <form id="requestResetForm" class="auth-form">
          <label>
            <span>Email</span>
            <input type="email" id="resetEmail" required />
          </label>
          <button type="submit" class="primary-btn full">Create reset token</button>
        </form>

        <div id="resetMessage" class="message-box hidden"></div>

        <form id="resetPasswordForm" class="auth-form hidden">
          <label>
            <span>Reset token</span>
            <input type="text" id="resetToken" required />
          </label>
          <label>
            <span>New password</span>
            <input type="password" id="newPassword" minlength="6" required />
          </label>
          <button type="submit" class="secondary-btn full">Reset password</button>
        </form>
      </main>
    </div>

    <script src="/reset-password.js"></script>
  </body>
</html>
